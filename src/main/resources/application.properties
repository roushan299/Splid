spring.application.name=Splid

## data source
spring.datasource.url=jdbc:mysql://localhost:3306/splid
spring.datasource.username=root
spring.datasource.password=14321432
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.pool-name:SplidDevPool
spring.datasource.hikari.maximum-pool-size:20
spring.datasource.hikari.idle-timeout:30000
spring.datasource.hikari.connection-time:2000


## flyway config
spring.datasource.fly.enabled: true
spring.datasource.fly.locations: classpath:db/migration

## server props
server.port=8081